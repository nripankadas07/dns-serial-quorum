[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "dns-serial-quorum"
version = "0.1.0"
description = "Classify equal, ahead, behind, half-range ambiguous and unavailable observations; calculate an explicit equality quorum."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{name = "Dr. Nripanka Das", email = "nripankadas@gmail.com"}]
dependencies = []
[project.scripts]
dns-serial-quorum = "dns_serial_quorum:main"
[tool.setuptools]
py-modules = ["dns_serial_quorum"]
